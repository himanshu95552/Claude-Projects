/* ---------- render ---------- */
function beatAnim(b,el,t){
  const u=t-b.s;
  if(t<b.s||t>=b.e){el.style.display='none';return}
  el.style.display='block';
  const dur=b.e-b.s, ex=clamp((u-(dur-.22))/.22);
  b.spans.forEach((sp,i)=>{
    let e=b.noEnter?1:eo((u-i*.065)/.38);
    let y=(1-e)*38-ex*28, o=e*(1-ex);
    sp.style.opacity=o.toFixed(3);
    sp.style.transform=`translateY(${y.toFixed(2)}px)`;
  });
}

function sceneAlpha(sc,t,first){
  const u=t-sc.s, dur=sc.e-sc.s;
  const en=first?1:eo(u/.25), ex=1-clamp((u-(dur-.22))/.22);
  return {a:en*ex, dy:(1-en)*16-(1-ex)*20};
}

window.render=function(t){
  t=Math.max(0,Math.min(T-1e-3,t));
  // header progress
  const hx=500+(984-500)*(t/T);
  $('prog').setAttribute('x2',hx);$('hdot').setAttribute('cx',hx);
  // beats
  beats.forEach((b,i)=>beatAnim(b,beatEls[i],t));
  // scenes
  let cur=scenes[0];
  scenes.forEach((sc,i)=>{
    const svg=svgs[sc.id];
    if(t<sc.s||t>=sc.e){svg.style.display='none';return}
    cur=sc;svg.style.display='block';
    const {a,dy}=sceneAlpha(sc,t,i===0);
    svg.style.opacity=a.toFixed(3);svg.style.transform=`translateY(${dy.toFixed(2)}px)`;
    const u=t-sc.s;
    ({s1:s1u,s2:s2u,s3:s3u,s4:s4u,s5:s5u,s6:s6u,s7:s7u})[sc.id](u,t);
  });
  $('footL').textContent=cur.tag;$('footR').textContent=cur.n+' / 07';
  // chip (Arc moment)
  const cu=t-28.4, chip=$('chip');
  if(cu>=1.3){const p=eo((cu-1.3)/.45), ex=1-clamp((cu-3.38)/.22);chip.style.display='flex';chip.style.opacity=(p*ex).toFixed(3);chip.style.transform=`translateY(${((1-p)*30-(1-ex)*20).toFixed(1)}px)`}
  else chip.style.display='none';
};

  const b1=u, b2=u-2.0, b3=u-4.0;
  pop(A2.chip1,706,76,(b1-.15)/.4);
  pop(A2.chip2,140,76,(b2-.15)/.4);
  const dim=lerp(1,.4,eo((b3-.05)/.4));
  setA(A2.world,dim);
  A2.house.setAttribute('stroke',b1>.15?C.blue:C.stroke);
  setA(A2.chip1,eo((b1-.15)/.4)*lerp(1,.35,eo((b3)/.4)));
