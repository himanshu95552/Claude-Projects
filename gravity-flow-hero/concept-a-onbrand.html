<!doctype html>
<html lang="en" data-surface="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Flow hero, concept A</title>
<link rel="stylesheet" href="plum-tokens.css">
<style>
  html,body{margin:0;height:100%;background:var(--ink)}
  body{display:grid;place-items:center}
  /* 4:3 frame, scales to any container; vector so it stays sharp at any size */
  #stage{width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;background:var(--ink)}
  svg{width:100%;height:100%;display:block}
  .hair{fill:none;stroke:var(--device-hairline);stroke-width:2;stroke-linecap:round}
  .hair.on{stroke:var(--plum-300)}
  .panel{fill:var(--bg-tint);stroke:var(--border-default);stroke-width:2}
  .card{fill:var(--ink-raised);stroke:var(--border-default);stroke-width:2}
  .bar-w{fill:var(--text-on-ink)} .bar-m{fill:var(--text-on-ink-muted)} .bar-p{fill:var(--plum-300)}
  .track{fill:rgba(255,255,255,.12)}
  .node{fill:var(--plum-300)} .lagoon{fill:var(--outcome-on-ink)}
  @font-face{font-family:Urbanist;font-weight:600;src:url(fonts/urbanist-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-weight:600;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
  .eb{font:600 17px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;fill:var(--plum-300)}
  .hd{font:600 42px Urbanist,sans-serif;letter-spacing:-.02em;fill:#fff}
  .ev{font:600 23px Inter,sans-serif;fill:#fff}
  .lb{font:600 30px Urbanist,sans-serif;fill:#fff}
  .sm{font:400 22px Inter,sans-serif;fill:var(--text-on-ink-muted)}
</style>
</head>
<body>
<div id="stage">
<svg id="s" viewBox="0 0 1600 1200" role="img" aria-label="Four events enter Gravity Flow. Routine work finishes on its own. Work that needs a decision is done by an agent. Anything it cannot finish lands on a worklist for your team.">
  <rect width="1600" height="1200" fill="#1B1430"/>
  <g id="scene"></g>
</svg>
</div>
<script>
const T=24000, NS="http://www.w3.org/2000/svg", scene=document.getElementById('scene');
const el=(tag,attrs={},parent=scene)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
const anims=[];
// keyframes by absolute time in ms: kf(el,[[t,{opacity:0}],...])
function kf(e,pts){
  const frames=pts.map(([t,p])=>({offset:Math.min(1,Math.max(0,t/T)),easing:'cubic-bezier(.4,0,.2,1)',...p}));
  if(frames[0].offset>0)frames.unshift({offset:0,...pts[0][1]});
  if(frames[frames.length-1].offset<1)frames.push({offset:1,...pts[pts.length-1][1]});
  anims.push(e.animate(frames,{duration:T,iterations:Infinity,fill:'both',easing:'linear'}));
}
const S=1000; // seconds→ms
// the line grows; its node appears after it lands (the node itself never moves or pulses)
function line(d,t0,t1,{cls='hair',len}={}){
  const p=el('path',{d,class:cls});const L=p.getTotalLength();
  p.style.strokeDasharray=L;
  kf(p,[[0,{strokeDashoffset:L,opacity:1}],[t0*S,{strokeDashoffset:L}],[t1*S,{strokeDashoffset:0}],[22.6*S,{strokeDashoffset:0,opacity:1}],[23.6*S,{strokeDashoffset:0,opacity:0}]]);
  return p;
}
function fade(e,t0,t1,from=0){kf(e,[[0,{opacity:from}],[t0*S,{opacity:from}],[t1*S,{opacity:1}],[22.6*S,{opacity:1}],[23.6*S,{opacity:0}]])}
function txt(x,y,str,cls,t,anchor='start'){const e=el('text',{x,y,class:cls,'text-anchor':anchor});e.textContent=str;fade(e,t,t+.5);return e}
function node(x,y,r,t,cls='node'){const c=el('circle',{cx:x,cy:y,r,class:cls});fade(c,t,t+.35);return c}

// engine panel
const eng=el('rect',{x:560,y:150,width:620,height:930,rx:20,class:'panel'});fade(eng,.2,1.4);

// events
const rows=[240,470,700,930];
const sizes=[[84,170,120],[96,150,130],[74,190,110],[88,160,140]];
rows.forEach((cy,i)=>{
  const g=el('g'); const [a,b,c]=sizes[i];
  el('rect',{x:96,y:cy-75,width:300,height:150,rx:14,class:'card'},g);
  el('circle',{cx:132,cy:cy-40,r:3.5,class:'node'},g);
  el('rect',{x:146,y:cy-43,width:a,height:6,rx:3,class:'bar-p'},g);
  el('rect',{x:128,y:cy+18,width:c,height:8,rx:4,class:'bar-m'},g);
  el('rect',{x:128,y:cy+40,width:c-30,height:8,rx:4,class:'bar-m'},g);
  const nm=['Appointment booked','Report signed','Order created','Patient missed the visit'][i];
  const tt=el('text',{x:128,y:cy+4,class:'ev'},g);tt.textContent=nm;
  kf(g,[[0,{opacity:0,transform:'translateX(-24px)'}],[(.3+i*.3)*S,{opacity:0,transform:'translateX(-24px)'}],[(1.1+i*.3)*S,{opacity:1,transform:'translateX(0)'}],[22.6*S,{opacity:1,transform:'translateX(0)'}],[23.6*S,{opacity:0,transform:'translateX(0)'}]]);
});

// routine work (rows 0,1): straight through, done on its own
[0,1].forEach((i,k)=>{
  const y=rows[i], t0=2.0+k*.5;
  line(`M396 ${y} H1340`,t0,t0+3,{});
  node(1340,y,9,t0+3);
});

// agent block
const agent=el('rect',{x:640,y:625,width:300,height:350,rx:14,class:'card'});fade(agent,2.6,3.6);
const lab=[[700,170],[790,170],[880,170]]; // three work bars: read, decide, act
const fills=[];
[0,1,2].forEach(i=>{
  const y=700+i*95;
  const gg=el('g');
  el('rect',{x:672,y:y,width:236,height:46,rx:8,class:'track'},gg);
  el('circle',{cx:694,cy:y+23,r:5,class:'node'},gg);
  const f=el('rect',{x:710,y:y+17,width:184,height:12,rx:6,class:'bar-p'},gg);
  f.style.transformOrigin=`710px ${y+23}px`;
  kf(f,[[0,{transform:'scaleX(0)'}],[(5.4+i*1.5)*S,{transform:'scaleX(0)'}],[(6.6+i*1.5)*S,{transform:'scaleX(1)'}],[22.6*S,{transform:'scaleX(1)',opacity:1}],[23.6*S,{transform:'scaleX(1)',opacity:0}]]);
  fade(gg,2.8,3.8);
});

// judgement work (rows 2,3): into the agent, out the other side
line(`M396 ${rows[2]} H640`,3.0,5.0); line(`M396 ${rows[3]} H640`,3.4,5.2);
line(`M940 ${rows[2]} H1340`,10.0,12.2); node(1340,rows[2],9,12.2);
line(`M940 ${rows[3]} H1244`,10.2,12.0);

// what the agent can't finish: worklist, with history attached
const wl=el('g');
el('rect',{x:1244,y:840,width:260,height:200,rx:14,class:'card'},wl);
[0,1,2].forEach(r=>{
  const y=858+r*58;
  el('rect',{x:1262,y:y,width:224,height:46,rx:8,class:r==0?'':'track',fill:r==0?'#F3EEFE':undefined},wl);
  el('circle',{cx:1284,cy:y+23,r:5,fill:r==0?'#6B3FE4':'#B4A8D6'},wl);
  el('rect',{x:1302,y:y+16,width:r==0?150:120,height:12,rx:6,fill:r==0?'#1B1430':'#B4A8D6'},wl);
});
kf(wl,[[0,{opacity:0}],[11.0*S,{opacity:0}],[12.0*S,{opacity:1}],[22.6*S,{opacity:1}],[23.6*S,{opacity:0}]]);
// every run on record: ticks accumulate along the bottom hairline, then the outcome
line('M96 1140 H1504',15.0,20.0,{});
for(let i=0;i<30;i++){
  const x=130+i*45.5, tk=el('rect',{x:x-1,y:1122,width:2,height:i%5==4?24:14,rx:1,fill:'#C9B3FF'});
  const t=15.2+i*.16; fade(tk,t,t+.2);
}
node(1504,1140,13,20.2,'lagoon');
// stage the outcome node larger (one Lagoon mark per surface)

// labels: what each part of the picture means
txt(96,56,'HOW A WORKFLOW RUNS','eb',.3);txt(96,106,'Any event in Gravity can start one.','hd',.5);
txt(596,188,'NOTHING TO DECIDE','eb',2.2);txt(596,224,'Done on its own','lb',2.4);
txt(596,566,'SOMETHING TO DECIDE','eb',3.2);txt(596,604,'An agent does the work','lb',3.4);
txt(1504,822,'EXCEPTIONS GO TO YOUR TEAM','eb',11.0,'end');
txt(1504,1072,'With the history attached','sm',13.2,'end');
txt(96,1108,'EVERY RUN ON RECORD','eb',15.0);txt(1504,1108,'PAID','eb',20.2,'end');
// reduced motion: hold the finished composition
if(matchMedia('(prefers-reduced-motion: reduce)').matches){anims.forEach(a=>{a.pause();a.currentTime=21500})}
window.__seek=ms=>{anims.forEach(a=>{a.pause();a.currentTime=ms})};
</script>
</body>
</html>
