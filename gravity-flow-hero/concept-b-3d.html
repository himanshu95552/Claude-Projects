<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Flow hero, concept B (3D exploration)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@600&display=swap">
<link rel="stylesheet" href="plum-tokens.css">
<style>
  html,body{margin:0;height:100%;background:#120c24}
  body{display:grid;place-items:center}
  #stage{width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3}
  svg{width:100%;height:100%;display:block}
  .eb{font:600 15px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;fill:var(--plum-300)}
  .lb{font:600 22px var(--font-display);fill:#fff;letter-spacing:-.01em}
  .sm{font:400 17px var(--font-text);fill:var(--text-on-ink-muted)}
</style>
</head>
<body>
<div id="stage">
<svg id="s" viewBox="0 0 1600 1200" role="img" aria-label="Four events enter Gravity Flow as glowing packets. Routine ones finish on their own. Ones that need a decision pass through an agent. What the agent cannot finish lands on a worklist for your team.">
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#2d2160"/><stop offset=".6" stop-color="#1B1430"/><stop offset="1" stop-color="#0f0a1f"/></radialGradient>
  <linearGradient id="plateTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2f73"/><stop offset="1" stop-color="#2a2050"/></linearGradient>
  <linearGradient id="plateL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241b48"/><stop offset="1" stop-color="#160f30"/></linearGradient>
  <linearGradient id="plateR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1439"/><stop offset="1" stop-color="#0f0a1f"/></linearGradient>
  <linearGradient id="agentTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E67EA"/><stop offset="1" stop-color="#582FD1"/></linearGradient>
  <linearGradient id="agentL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a33c9"/><stop offset="1" stop-color="#3A1C86"/></linearGradient>
  <linearGradient id="agentR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f23a0"/><stop offset="1" stop-color="#25115f"/></linearGradient>
  <linearGradient id="evTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEFE"/><stop offset="1" stop-color="#CDB9F8"/></linearGradient>
  <linearGradient id="doneTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A8F1F7"/><stop offset="1" stop-color="#22C1CE"/></linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#C9B3FF"/><stop offset="1" stop-color="#6B3FE4" stop-opacity=".0"/></radialGradient>
  <radialGradient id="orbHot"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FFD9A8"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<g id="world"></g>
<g id="labels"></g>
</svg>
</div>
<script>
const NS="http://www.w3.org/2000/svg",T=24;
const world=document.getElementById('world'),labels=document.getElementById('labels');
const el=(t,a={},p=world)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
// isometric projection: x runs right-down, y runs left-down, z up
const SC=42,OX=730,OY=370;
const P=(x,y,z=0)=>[OX+(x-y)*.866*SC, OY+(x+y)*.5*SC - z*SC];
const pts=a=>a.map(p=>p.join(',')).join(' ');
function box(x,y,z,w,d,h,f,r=0){ // top, left (facing +y... visible), right
  const [t,l,rr]=f;
  const A=P(x,y,z+h),B=P(x+w,y,z+h),C=P(x+w,y+d,z+h),D=P(x,y+d,z+h);
  const A0=P(x,y,z),B0=P(x+w,y,z),C0=P(x+w,y+d,z),D0=P(x,y+d,z);
  const g=el('g');
  el('polygon',{points:pts([D,C,C0,D0]),fill:l},g);   // front-left face
  el('polygon',{points:pts([B,C,C0,B0]),fill:rr},g);  // front-right face
  const top=el('polygon',{points:pts([A,B,C,D]),fill:t},g);
  return {g,top};
}
function shadowOf(x,y,w,d,op=.5){const g=el('g',{filter:'url(#shadow)',opacity:op});el('polygon',{points:pts([P(x,y,0),P(x+w,y,0),P(x+w,y+d,0),P(x,y+d,0)]),fill:'#000'},g)}
const Lt=(x,y,z,txt,cls,anchor='start')=>{const [px,py]=P(x,y,z);const t=el('text',{x:px,y:py,class:cls,'text-anchor':anchor},labels);t.textContent=txt;return t};

// ---- scene layout (iso grid units) ----
const rows=[0,3.2,6.4,9.6]; // y of the four event lanes
const names=['Appointment booked','Report signed','Order created','Patient missed the visit'];
// engine plate
shadowOf(5.2,-1.4,10.6,13.6,.7);
box(5.2,-1.4,0,10.6,13.6,.5,['url(#plateTop)','url(#plateL)','url(#plateR)']);
// lane grooves on the plate
const lanes=rows.map(y=>{const a=P(0,y+.8,.55),b=P(19,y+.8,.55);return [a,b]});
// events (left)
const evs=rows.map((y,i)=>{
  shadowOf(.4,y,3.2,1.6,.5);
  const b=box(.4,y,0,3.2,1.6,.7,['url(#evTop)','#9c86e0','#6e57b8']);
  return b});
// done tiles (right of plate)
const dones=[0,1].map(i=>{const y=rows[i]; shadowOf(17,y,2.6,1.6,.5);return box(17,y,0,2.6,1.6,.5,['#3a2f6a','#241b48','#160f30'])});
// agent block
shadowOf(8.2,5.4,3.4,7,.6);
const agent=box(8.2,5.4,.5,3.4,7,1.5,['url(#agentTop)','url(#agentL)','url(#agentR)']);
// finished output for agentic lane 3 and worklist for lane 4
const done3=box(17,rows[2],0,2.6,1.6,.5,['#3a2f6a','#241b48','#160f30']);
shadowOf(16.2,rows[3]-.4,3.6,2.4,.6);
const work=box(16.2,rows[3]-.4,0,3.6,2.4,.7,['#F3EEFE','#9c86e0','#6e57b8']);
[0,1,2].forEach(i=>{const a=P(16.7,rows[3]-.1+i*.6,.72),b=P(18.8,rows[3]-.1+i*.6,.72);el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:i==0?'#6B3FE4':'#B4A8D6','stroke-width':8,'stroke-linecap':'round'})});

// grooves + paths for packets
const pathFor=(i)=>{ // returns list of iso points
  const y=rows[i]+.8, z=.62;
  if(i<2)return [[1.6,y,z],[17.4,y,z]];
  if(i==2)return [[1.6,y,z],[8.2,y,z],[8.2,y,z],[11.8,y,z],[17.4,y,z]];
  return [[1.6,y,z],[8.2,y,z],[11.8,y,z],[16.6,y,z]];
};
const grooves=rows.map((y,i)=>{const p=pathFor(i).map(q=>P(...q));el('polyline',{points:pts(p),fill:'none',stroke:'#C9B3FF','stroke-opacity':.35,'stroke-width':3,'stroke-linecap':'round'});return p});

// packets (glowing orbs) with trail; the packet at lane 4 is the exception (amber, then hands to worklist)
const orbs=rows.map((_,i)=>{
  const g=el('g',{});
  el('circle',{r:34,fill:i==3?'url(#orbHot)':'url(#orb)',filter:'url(#soft)',opacity:.9},g);
  el('circle',{r:11,fill:'#fff'},g);
  return g});
// path utilities
function along(poly,u){ // u in 0..1 along polyline
  const seg=[];let tot=0;for(let k=0;k<poly.length-1;k++){const l=Math.hypot(poly[k+1][0]-poly[k][0],poly[k+1][1]-poly[k][1]);seg.push(l);tot+=l}
  let d=u*tot;for(let k=0;k<seg.length;k++){if(d<=seg[k]||k==seg.length-1){const f=seg[k]?Math.min(1,d/seg[k]):0;return [poly[k][0]+(poly[k+1][0]-poly[k][0])*f,poly[k][1]+(poly[k+1][1]-poly[k][1])*f]}d-=seg[k]}
}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
// schedule: each lane [start, arriveAgent(optional), leaveAgent, end]
function update(t){
  // lanes 0,1 routine
  [0,1].forEach(i=>{const s=1.5+i*.6;const u=ease(seg(t,s,s+4.2));orbs[i].setAttribute('transform',`translate(${along(grooves[i],u)})`);orbs[i].style.opacity=(t<s?0:(t>22.6?clamp(23.6-t):1))});
  // lanes 2,3 via agent: travel, dwell (thinking), travel
  [2,3].forEach(i=>{
    const s=2.6+(i-2)*.6; const u1=ease(seg(t,s,s+3.4)), u2=ease(seg(t,s+3.4+3.2,s+3.4+3.2+(i==2?3.4:2.6)));
    const g=grooves[i]; // points: start, entry, exit, end
    const entry=g.length==5?2:1; // index of agent entry
    const pre=g.slice(0,entry+1), post=g.slice(entry+1-0 > g.length-1?g.length-1:entry);
    let pos;
    if(t<s+3.4+3.2){pos=along(g.slice(0,i==2?3:2),u1)} else {pos=along(g.slice(i==2?3:1),u2)}
    // while inside agent, hover and orbit slightly
    if(t>s+3.4&&t<s+3.4+3.2){const k=(t-s-3.4)*3;pos=[pos[0]+Math.cos(k)*14,pos[1]+Math.sin(k)*7-6]}
    orbs[i].setAttribute('transform',`translate(${pos})`);
    orbs[i].style.opacity=(t<s?0:(t>22.6?clamp(23.6-t):1));
  });
  // lights: done tiles glow once their packet lands
  const lit=(b,on)=>{b.top.setAttribute('fill',on?'url(#doneTop)':b.top.dataset.f||b.top.getAttribute('fill'))};
  [[dones[0],5.7],[dones[1],6.3],[done3,15.2]].forEach(([b,tt])=>{if(!b.top.dataset.f)b.top.dataset.f=b.top.getAttribute('fill');lit(b,t>tt&&t<22.6)});
  // agent top breathes while working
  const a=(t>3&&t<14)?.5+.5*Math.sin(t*4):0;agent.g.style.filter=`brightness(${1+a*.12})`;
  // label reveals
  labelEls.forEach(([e,a0,a1])=>e.style.opacity=clamp(Math.min(seg(t,a0,a0+.8),1-seg(t,22.6,23.6)),0,1));
}
// labels (sentence case; eyebrow caps)
const labelEls=[];
const addL=(e,a0)=>labelEls.push([e,a0]);
const L=(x,y,z,txt,cls,a0,anchor)=>{const e=Lt(x,y,z,txt,cls,anchor);labelEls.push([e,a0]);return e};
rows.forEach((y,i)=>L(.4,y+2.4,.7,names[i],'lb',.2+i*.3,'end'));
L(.4,-1.0,.9,'Any event','eb',.1,'end');
L(10.5,-1.2,.6,'Gravity Flow','eb',1.0,'middle');
L(18.3,-.9,2.0,'Nothing to decide','eb',4,'middle');
L(18.3,-.9,1.35,'Done on its own','lb',4,'middle');
L(9.9,4.6,3.7,'Something to decide','eb',5.5,'middle');
L(9.9,4.6,3.05,'An agent does the work','lb',5.5,'middle');
L(18,rows[3]+3.6,0,'Exceptions go to your team','lb',11.5,'middle');
// reduced motion: hold finished
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seek=null; window.__seek=s=>{seek=s/1000;update(seek)};
if(rm){update(21)}else{const t0=performance.now();(function f(){if(seek===null)update(((performance.now()-t0)/1000)%T);requestAnimationFrame(f)})()}
</script>
</body>
</html>
