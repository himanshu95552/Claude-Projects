<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Flow hero, concept B (real 3D)</title>
<link rel="stylesheet" href="plum-tokens.css">
<style>
  @font-face{font-family:Urbanist;font-weight:600;src:url(fonts/urbanist-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-weight:600;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
  html,body{margin:0;height:100%;background:#120c24;overflow:hidden}
  #frame{width:1600px;height:1200px;position:absolute;left:50%;top:50%;transform-origin:center}
  #gl,#gl canvas{position:absolute;inset:0;width:1600px;height:1200px;display:block}
  #labels{position:absolute;inset:0;pointer-events:none}
  .lab{position:absolute;display:flex;flex-direction:column;gap:6px;transform:translate(-50%,-100%);white-space:nowrap;opacity:0}
  .lab.r{transform:translate(-100%,-100%);align-items:flex-end;text-align:right}
  .eb{font:600 17px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#C9B3FF}
  .tx{font:600 28px Urbanist,sans-serif;letter-spacing:-.01em;color:#fff}
</style>
</head>
<body>
<div id="frame" role="img" aria-label="Four events travel as light across a plum engine. Routine ones finish on their own. Ones that need a decision pass through an agent. What it cannot finish lands on a worklist for your team."><div id="gl"></div><div id="labels"></div></div>
<script src="vendor/concept-b.bundle.js"></script>
</body>
</html>
