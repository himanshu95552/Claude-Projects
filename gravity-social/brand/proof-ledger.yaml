# Claims that must NEVER appear, however they are worded. The linter blocks the
# patterns in brand/guardrails.yaml; this list is the human-readable reason.
forbidden:
  - "Any customer count ('40 customers', '22 centers'). Logos carry it; no number."
  - "The founder's '$400K loss to $350K profit' turnaround. Stays out until a before-and-after artifact exists."
  - "Any referral-lift result: none is measured."
  - "Any denial-rate, A/R, or collection-rate result at a customer: none is measured."
  - "Exception rate by workflow: not yet published."
  - "Any KLAS finding, until the report's exact published wording is added here."
  - "'2x exam volume per staff member', 'ROI within months', '$500-$2,000 per missed auth' (older blog lines; not AN27-approved)."
  - "Any figure from a named customer other than Tower Radiology (e.g. ProScan needs its OK first)."
  - "Any real center's P&L, headcount or annual dollars. The unit is one exam, modeled."
  - "Pricing detail beyond '$3.45 an exam, all in' in the unit-economics context."
  - "Call-center benchmarks from Patient Prism (7% abandonment, 4.4-minute hold): a vendor compilation, internal use only."
  - "'Five to seven minutes to under one' (order intake) and '35 to 40 percent' (pre-check-in): no source, dropped."
  - "Buyer quotes from recorded calls (Winning Story section 1): internal research, never quoted publicly without the speaker's permission."
