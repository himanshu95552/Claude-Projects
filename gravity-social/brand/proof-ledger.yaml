# Gravity proof ledger
# The ONLY numbers and proof claims that may appear in public social content.
# scripts/gravity_lint.py reads this file: any $ amount, percentage, multiplier
# or large number in a post that is not listed under some entry's `figures`
# fails lint. To add a proof point, add an entry here with its source and have
# Shamit approve it (AN27 Open Items Register is the reference).
#
# Fields:
#   id          cite this in a post's `claims:` frontmatter
#   claim       the approved wording (paraphrase carefully; keep the qualifiers)
#   figures     literal tokens the linter will accept (normalized: no spaces, lower case)
#   source      where it comes from; say it in the post when `attribute` is true
#   attribute   true = the post must name the source (e.g. "RSNA 2021", "AMA")
#   must_say    wording that must travel with the claim
#   requires    other figures that must appear in the same post
#   status      locked | beta | modeled | benchmark

