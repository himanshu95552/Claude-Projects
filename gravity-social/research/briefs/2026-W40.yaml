week: 2026-W40
dates: 2026-09-28..2026-10-04
phase: category-seeding
summary: "UnitedHealthcare's Surest plans start requiring prior authorization for outpatient CT, MRI, PET and nuclear cardiology on October 1, a live example of the revenue leak that starts at scheduling. 'Agentic AI in radiology' is being defined almost entirely by image interpretation, which leaves the operations side (the order, the phone, the portal) open for the Agentic Operations System (AOS) definition. On LinkedIn, imaging prior-auth content from operators draws single-digit engagement; the posts that did better were specific scenes and first-person frustration, not vendor claims."
trend_to_ride:
  topic: "Surest (UnitedHealthcare) prior authorization for outpatient advanced imaging, effective Oct 1, 2026"
  why: "It lands in our week, it names the exact modalities our buyers schedule, and it proves the point that auth rules change underneath the schedule. The denial is decided at scheduling and discovered weeks later."
  leak: revenue
trends:
  - topic: "Surest prior auth for outpatient CT, MRI/MRA, nuclear cardiology and PET"
    signal: "Effective Oct 1, 2026 for Surest fully insured and level-funded plans; the rendering provider must confirm a coverage decision before performing the exam (UHC provider news, 22 Jun 2026)."
    evidence: "https://www.uhcprovider.com/en/resource-library/news/2026/pa-surest-radiology-services.html"
    fits: revenue
    note: "Ride it on Oct 1. Frame: payer rules move under the schedule; checking at scheduling is the only place the denial is cheap to fix. Don't give payer advice; describe the operational reality."
  - topic: "CMS CY2027 physician fee schedule (proposed): conversion factor about -1.68%; diagnostic radiology RVUs about +2%; imaging centers roughly flat"
    signal: "Proposed 14 Jul 2026; comments closed 14 Sep; final rule expected late Oct / early Nov (Radiology Business, 15 Jul 2026; ACR summary)."
    evidence: "https://radiologybusiness.com/topics/healthcare-management/healthcare-policy/medicare-releases-2027-physician-fee-schedule-devastating-cuts-radiologist-payments"
    fits: revenue
    note: "Hold until the final rule (likely W44-W45, the proof-and-economics phase). Pair with 'your exam, itemized': per-exam revenue is squeezed, and the paper line is the cost you control. Don't quote the percentages until they're added to the ledger."
  - topic: "CMS request for information on duplicate imaging: results 'frequently siloed' in the acquiring EHR"
    signal: "Part of the CY2027 proposed rule (CMS fact sheet, via Radiology Business)."
    evidence: "https://radiologybusiness.com/topics/healthcare-management/healthcare-policy/medicare-releases-2027-physician-fee-schedule-devastating-cuts-radiologist-payments"
    fits: referral
    note: "A regulator saying the report doesn't get back. Good for the referral-loop pillar later: 'Every report returned.' Add the disclaimer: we deliver it, we don't read it."
  - topic: "Agentic AI in radiology is being defined as interpretation"
    signal: "2026 reviews in Radiology, Radiology: AI and Frontiers in Medicine describe agentic AI chaining image-reading and reporting steps."
    evidence: "https://pubs.rsna.org/doi/10.1148/radiol.252730"
    fits: category
    note: "Whitespace for the AOS: the other half of the building (order, phone, fax, portal) has no agentic definition yet. Say 'an AOS is not diagnostic AI' and let the five tests carry it."
  - topic: "CMS-0057-F payer turnaround rules (72 hours urgent / 7 days standard) in effect since Jan 2026"
    signal: "Background for prior-auth posts (Linear Health 2026 guide)."
    evidence: "https://linear.health/blog/prior-authorization-mri-imaging"
    fits: skip
    note: "Useful context, but a 7-day payer clock doesn't help a center that never knew the auth was needed. Not this week."
  - topic: "Saudi imaging market forecasts, general market-size posts"
    signal: "Common on LinkedIn; zero engagement."
    evidence: ""
    fits: skip
    note: "Market-size content doesn't move our audience."
competitor_posts:
  - who: "Cory Maffeo (practice operations)"
    platform: linkedin
    url: "https://www.linkedin.com/posts/corymaffeo_medicalpractice-priorauthorization-healthcareoperations-activity-7503156456490299392-vohZ"
    format: text
    hook: "Prior authorization is a workflow designed by people who will never have to run it."
    performance: "1 reaction, 1 comment (the sample's baseline is very low)"
    why_it_worked: "A contrarian first line in the operator's voice, then the sequence step by step (PDF rules, the portal, the fax asking for a document already sent). The body is strong; reach was small."
  - who: "Pyramids Global (RCM services)"
    platform: linkedin
    url: "https://www.linkedin.com/posts/pyramids-global_the-scan-was-ordered-the-auth-wasnt-there-activity-7507806365172789248-gvbO"
    format: text
    hook: "The scan was ordered. The auth wasn't there."
    performance: "1 reaction"
    why_it_worked: "The sharpest idea in the sample: in imaging a missing auth is a write-off, not a delay, because most payers won't approve retroactively. The post undersold it by closing on a services pitch."
  - who: "Aleena Mujtaba (hiring post)"
    platform: linkedin
    url: "https://www.linkedin.com/posts/aleena-mujtaba-711296378_prior-authorization-surgical-scheduling-activity-7499498228816506881-qGSm"
    format: text
    hook: "We are hiring a Prior Authorization & Surgical Scheduling Specialist"
    performance: "18 reactions, 6 comments (highest in the prior-auth sample)"
    why_it_worked: "Hiring posts draw the people who do the job. Signal: the prior-auth workforce is an active, engaged audience, and practices still hire people to do nothing else (AMA: 40% of practices, B05)."
  - who: "Jason Prestinario (health data)"
    platform: linkedin
    url: "https://www.linkedin.com/posts/jason-prestinario-7ab36373_for-1-in-5-women-who-appeared-to-have-an-activity-7501283274996989953-wpbI"
    format: text
    hook: "For 1 in 5 women who appeared to have an open breast cancer screening gap, we found qualifying mammogram evidence somewhere else."
    performance: "26 reactions, 3 comments, 3 shares"
    why_it_worked: "A surprising number, then the reframe: 'It wasn't a complicated AI problem. The evidence simply existed outside' the system that was looking. The same argument as ours: each leak lives in a different system."
  - who: "Lunit Cancer Screening"
    platform: linkedin
    url: "https://www.linkedin.com/posts/lunit_breastcancer-breastcancerscreening-radiology-activity-7500896612425134080-1-bf"
    format: text
    hook: "Not every finding deserves a second look. These do."
    performance: "18 reactions, 6 shares"
    why_it_worked: "A curiosity-gap list in seven words. Selective, confident, and it promises a short list."
