    count: 3
    examples: ["Every payer can have different requirements for the same procedure (prior-auth specialist, LinkedIn)", "Surest adds CT/MRI/PET auth on Oct 1 while UHC dropped some nuclear and OB ultrasound auths in January"]
    source: "LinkedIn prior-auth posts (Crustdata sample); UHC provider news"
    persona: rcm
  - theme: "Why does the patient call asking when their scan is scheduled?"
    count: 2
    examples: ["Coordinators chase missing documentation while patients call asking when their scan is scheduled", "Front desk calls the payer, waits on hold, calls back in 48 hours"]
    source: "Imaging prior-auth articles (Pretty Good AI, OmniMD)"
    persona: scheduling
  - theme: "Is agentic AI going to read our studies?"
    count: 3
    examples: ["Agentic AI in radiology workflow: from image interpretation to report quality control", "Reconfiguring work: AI, agentic AI and the future of the radiology profession"]
    source: "Radiology, Radiology: AI, Frontiers, PMC (2026)"
    persona: owner
hooks:
  - id: h1
    source: "Cory Maffeo, LinkedIn"
    platform: linkedin
    source_hook: "Prior authorization is a workflow designed by people who will never have to run it."
    pattern: "Contrarian"
    why: "It takes the operator's side against the system, not against the staff."
    curiosity: 2
    specific: 1
    relatable: 2
    gravity_version: "In imaging, prior authorization isn't a billing problem. It's a scheduling decision that nobody checks until the denial."
  - id: h2
    source: "Pyramids Global, LinkedIn"
    platform: linkedin
    source_hook: "The scan was ordered. The auth wasn't there."
    pattern: "Scene / Warning"
    why: "Two short sentences, and you can see the problem."
    curiosity: 3
    specific: 2
    relatable: 2
    gravity_version: "The MRI is done. The approval never was. Six weeks later the denial arrives, and nothing can fix it now."
  - id: h3
    source: "Jason Prestinario, LinkedIn"
    platform: linkedin
    source_hook: "For 1 in 5 women who appeared to have an open breast cancer screening gap, we found qualifying mammogram evidence somewhere else."
    pattern: "Number / hidden elsewhere"
    why: "The answer existed; it lived in a system nobody was looking at."
    curiosity: 3
    specific: 2
    relatable: 1
    gravity_version: "Your referral data doesn't know about your denials. Your schedule doesn't know which referrer's orders keep getting rejected."
  - id: h4
    source: "Lunit, LinkedIn"
    platform: linkedin
    source_hook: "Not every finding deserves a second look. These do."
    pattern: "Curiosity gap / selective list"
    why: "It promises a short, confident list."
    curiosity: 3
    specific: 1
    relatable: 1
    gravity_version: "Most orders don't need a person. Some always will. Here's the short list."
  - id: h5
    source: "AN27 deck, slide 8 (our own line)"
    platform: linkedin
    source_hook: "Airlines fill about 85% of their seats. Imaging centers fill about 65% of their slots."
    pattern: "Comparison"
    why: "A familiar industry beside ours makes the gap obvious."
    curiosity: 2
    specific: 2
    relatable: 2
    gravity_version: "Airlines fill about 85% of their seats. Imaging centers fill about 65% of their slots. And patients still wait weeks."
  - id: h6
    source: "AN27 deck, slide 6 (our own line)"
    platform: linkedin
    source_hook: "How many referrals went to another center last month?"
    pattern: "Question they can't answer"
    why: "Most centers can't answer it, and knowing that is the point."
    curiosity: 3
    specific: 2
    relatable: 2
    gravity_version: "How many orders arrived last month and never became exams? Most imaging centers can't say."
