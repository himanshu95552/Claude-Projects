# Gravity Social: system configuration
# Every module reads this file first. Change behaviour here, not in the skills.

brand:
  company: Alpha Nodus
  product: Gravity
  category: "Agentic Operations System (AOS)"
  website: https://www.alphanodus.com
  timezone: America/Chicago          # RSNA is in Chicago; switch to America/New_York if the team prefers
  source_of_truth: AN27 (Positioning v1.7, Messaging Package v1.0, Deck Outline v2.1, Unit Economics v1.1, SEO Map v0.1)

# The human gate. Nothing is scheduled or published unless an approver below
# approved it through scripts/gate.py. The Metricool hook enforces this.
approval:
  approvers:                              # the first name is the day-to-day approver shown in the dashboard
    - name: Tushant
      role: Marketing Manager (day-to-day approver for company-page, X, Instagram and YouTube posts)
    - name: Shamit Patel
      role: Founder and CEO (final say on voice and claims; sole approver of his own posts)
  founder_posts_require: Shamit Patel     # posts on Shamit's personal profile need Shamit's own approval
  metricool_second_gate: true             # also send approved posts to Metricool "for review"
  metricool_reviewers: ""                 # comma-separated emails for Metricool's review flow; fill in
  metricool_approval_system: any          # any | all | optional

# Accounts. enabled: false = the content module will not draft for it.
platforms:
  linkedin-company:
    enabled: true
    handle: https://www.linkedin.com/company/alphanodus
    metricool_network: linkedin
    posts_per_week: 4
  linkedin-founder:
    enabled: true
    handle: "Shamit Patel (personal profile)"
    metricool_network: null              # personal profiles are posted by Shamit; the system drafts only
    posts_per_week: 3
  x:
    enabled: true
    handle: https://x.com/alphanodus
    metricool_network: twitter
    posts_per_week: 7                     # includes 1 thread
  instagram:
    enabled: true
    handle: https://www.instagram.com/alphanodus/
    metricool_network: instagram
    posts_per_week: 3                     # 2 carousels + 1 reel
  youtube-shorts:
    enabled: true                         # reel scripts are reused with search-phrase titles
    handle: ""                            # no channel is linked from alphanodus.com yet; add it here and connect it in Metricool
    metricool_network: youtube
    posts_per_week: 1

metricool:
  brand_id: "6979710"                    # blogId; no networks connected yet (connect at app.metricool.com)
  auto_publish: false                     # false = Metricool pushes a phone notification; a person taps publish

# Where links go. Every link gets UTM parameters (scripts/utm.py).
links:
  home: https://www.alphanodus.com/
  aos_definition: https://www.alphanodus.com/post/what-is-an-agentic-operations-system-aos   # switch to /aos when published
  demo: https://www.alphanodus.com/contact            # the contact page embeds Calendly ("Schedule a Demo")
  calendly_demo: ""                                    # the Calendly event URL, e.g. https://calendly.com/<account>/<event>.
                                                       # When set, demo CTAs link straight to it and Calendly records the UTMs.
  exam_itemized: https://www.alphanodus.com/contact   # the free "your exam, itemized" review; give it its own page when possible
  trust_center: https://security.alphanodus.com
# Public URLs for rendered media. The repo is public, so GitHub serves the frames directly
# (Metricool fetches them from here). Change the branch segment after merging to main.
media:
  base_url: https://raw.githubusercontent.com/himanshu95552/Claude-Projects/claude/laughing-bardeen-5uf8wh/gravity-social/content/assets
utm:
  campaign_default: an27
  medium: social

# Campaign calendar. The content module weights pillars by the active phase.
campaigns:
  - id: rsna-2026
    name: "RSNA 2026, Chicago"
    event_dates: 2026-11-29..2026-12-03
    exhibit_hall: 2026-11-29..2026-12-02
    booth: "TBD"                          # fill in the booth number
    phases:
      - {name: category-seeding, from: 2026-09-28, to: 2026-10-25}
      - {name: proof-and-economics, from: 2026-10-26, to: 2026-11-15}
      - {name: rsna-countdown, from: 2026-11-16, to: 2026-11-28}
      - {name: rsna-live, from: 2026-11-29, to: 2026-12-03}
      - {name: rsna-follow-up, from: 2026-12-04, to: 2026-12-18}

# Demo requests land in Calendly (embedded on the contact page). Import them with
# scripts/import_calendly.py <export.csv>; each booking whose utm_content is a post id
# becomes a row in reports/outcomes.csv.
calendly:
  exam_itemized_event_keywords: ["itemized", "leakage review", "exam review"]   # event-type names that count as "exam itemized" requests
  free_email_domains: [gmail.com, yahoo.com, outlook.com, hotmail.com, icloud.com, aol.com, proton.me, protonmail.com]

reporting:
  daily_report_time: "07:30"
  email_draft_to: ""                      # optional: Gmail draft of the daily one-pager; left empty = file only
  outcome_events:                         # the funnel the system tracks, top to bottom
    - impression
    - engagement
    - follower
    - link_click
    - demo_request
    - exam_itemized_request
    - opportunity
    - customer
